<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="157 134.5 716 716"
     width="1024" height="1024"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Druid Forge circuit-anvil logo</title>
  <desc id="desc">Fully editable vector recreation of the supplied cyan-to-violet anvil logo. No raster image is embedded.</desc>

  <defs>
    <linearGradient id="baseGradient" x1="218" y1="500" x2="806" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d7ff"/>
      <stop offset=".22" stop-color="#247eff"/>
      <stop offset=".46" stop-color="#413fff"/>
      <stop offset=".68" stop-color="#7627f7"/>
      <stop offset="1" stop-color="#a916ec"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(450 334) rotate(2) scale(365 128)">
      <stop offset="0" stop-color="#00ffff" stop-opacity=".98"/>
      <stop offset=".42" stop-color="#00ddff" stop-opacity=".68"/>
      <stop offset=".78" stop-color="#00baff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#00aaff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerTopGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(536 344) rotate(0) scale(180 96)">
      <stop offset="0" stop-color="#03dfff" stop-opacity=".56"/>
      <stop offset=".68" stop-color="#16bfff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#268cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftFootGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(350 618) rotate(-8) scale(178 102)">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#00cfff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#008cff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightFootGlow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(665 620) rotate(8) scale(190 115)">
      <stop offset="0" stop-color="#df35ff" stop-opacity=".34"/>
      <stop offset=".62" stop-color="#bf25ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9b1df5" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nodeLeftFill" x1="432" y1="398" x2="450" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08c9ff"/>
      <stop offset="1" stop-color="#256cff"/>
    </linearGradient>
    <linearGradient id="nodeCenterFill" x1="537" y1="422" x2="549" y2="434" gradientUnits="userSpaceOnUse">
      <stop stop-color="#247cff"/>
      <stop offset="1" stop-color="#5636ff"/>
    </linearGradient>
    <linearGradient id="nodeRightFill" x1="580" y1="383" x2="596" y2="399" gradientUnits="userSpaceOnUse">
      <stop stop-color="#218bff"/>
      <stop offset="1" stop-color="#4a3aff"/>
    </linearGradient>

    <clipPath id="anvilClip">
      <path d="M392 334 H683 V353 H806
C785.44 429.89 701.81 442.81 639 463
C558.84 506.12 625.27 607.66 699 604
V656 H599
C544.74 629.03 478.28 628.60 424 656
H323 V603
C400.65 610.17 464.01 498.71 379 461
C316.11 445.26 234.46 426.18 218 352
H392 Z"/>
    </clipPath>
    <clipPath id="centerUpperClip">
      <rect x="420" y="350" width="155" height="206"/>
    </clipPath>

    <filter id="edgeSoftening" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation=".22"/>
    </filter>
  </defs>

  <g id="anvil">
    <path id="anvil-body"
      d="M392 334 H683 V353 H806
C785.44 429.89 701.81 442.81 639 463
C558.84 506.12 625.27 607.66 699 604
V656 H599
C544.74 629.03 478.28 628.60 424 656
H323 V603
C400.65 610.17 464.01 498.71 379 461
C316.11 445.26 234.46 426.18 218 352
H392 Z"
      fill="url(#baseGradient)"
      stroke="#2450f2"
      stroke-width="1.15"
      stroke-linejoin="round"
      vector-effect="non-scaling-stroke"/>

    <g id="anvil-lighting" clip-path="url(#anvilClip)">
      <rect x="200" y="315" width="630" height="355" fill="url(#topGlow)"/>
      <rect x="200" y="315" width="630" height="355" fill="url(#centerTopGlow)"/>
      <rect x="200" y="315" width="630" height="355" fill="url(#leftFootGlow)"/>
      <rect x="200" y="315" width="630" height="355" fill="url(#rightFootGlow)"/>

      <path id="horn-highlight"
        d="M228 365 C253 366 282 367 308 369 L348 390
           C318 384 286 379 257 375 Z"
        fill="#88f8ff" opacity=".44"/>

      <path id="left-root-shade"
        d="M507 488
           C506 541 484 590 447 622
           C436 632 428 644 424 656
           C451 647 474 640 497 636
           C505 613 510 583 511 548 Z"
        fill="#2735ca" opacity=".22"/>

      <path id="right-root-shade"
        d="M514 489
           C520 544 548 595 576 620
           C587 631 595 644 599 656
           C574 647 550 640 526 636
           C520 613 515 582 513 548 Z"
        fill="#3200a5" opacity=".27"/>

      <path id="left-foot-bevel"
        d="M323 603 C365 598 398 586 420 565
           C404 587 372 602 336 610 H323 Z"
        fill="#38e8ff" opacity=".20"/>

      <path id="right-foot-bevel"
        d="M699 604 C659 596 630 584 610 565
           C630 591 661 609 699 617 Z"
        fill="#5b00ca" opacity=".14"/>
    </g>

    <path id="notch-shine"
      d="M383 353 C383 362 386 375 391 386 V353 Z"
      fill="#f8ffff"
      stroke="#c8ffff"
      stroke-width=".55"
      vector-effect="non-scaling-stroke"/>
  </g>

  <g id="circuit-markings"
     fill="#fbffff"
     stroke="#2752f4"
     stroke-width="1.18"
     stroke-linejoin="round"
     stroke-linecap="round"
     paint-order="stroke fill"
     vector-effect="non-scaling-stroke">

    <rect id="upright-left" x="478" y="359" width="10" height="59"/>

    <path id="center-circuit-upper" d="M 505 359 L 505 456 L 504 457 L 502 457 L 480 446 L 478 444 L 478 434 L 453 417 L 455 413 L 455 404 L 452 398 L 448 394 L 441 392 L 435 393 L 430 396 L 426 404 L 426 410 L 429 417 L 431 419 L 437 422 L 445 422 L 470 440 L 469 442 L 470 443 L 470 452 L 502 467 L 505 470 L 505 552 L 504 553 L 504 557 L 500 567 L 490 583 L 479 597 L 472 604 L 485 590 L 494 578 L 497 572 L 499 570 L 500 571 L 500 575 L 501 573 L 503 575 L 502 578 L 494 589 L 479 604 L 496 587 L 509 568 L 509 566 L 511 565 L 512 568 L 521 581 L 539 600 L 568 621 L 544 597 L 533 584 L 521 567 L 514 551 L 514 408 L 540 391 L 540 359 L 531 359 L 531 385 L 515 397 L 514 396 L 514 359 Z" clip-path="url(#centerUpperClip)"/>
    <path id="right-circuit" d="M 581 379 L 577 382 L 574 388 L 574 396 L 576 399 L 549 417 L 546 416 L 537 416 L 533 418 L 529 423 L 529 426 L 528 427 L 529 432 L 531 436 L 537 440 L 537 489 L 526 496 L 526 540 L 528 547 L 532 553 L 539 560 L 558 573 L 590 589 L 605 594 L 618 600 L 630 604 L 679 604 L 680 603 L 687 603 L 680 603 L 679 602 L 675 602 L 674 601 L 670 601 L 665 599 L 661 599 L 660 598 L 656 598 L 655 597 L 651 597 L 650 596 L 639 594 L 635 592 L 632 592 L 625 589 L 622 589 L 613 586 L 610 584 L 592 578 L 565 565 L 549 555 L 539 545 L 536 539 L 536 502 L 540 499 L 544 498 L 546 496 L 550 495 L 572 484 L 575 481 L 575 458 L 577 456 L 590 450 L 626 428 L 566 451 L 566 475 L 548 485 L 546 484 L 546 440 L 553 435 L 555 430 L 555 424 L 558 421 L 561 420 L 582 405 L 590 406 L 598 402 L 601 397 L 602 391 L 601 390 L 601 387 L 597 381 L 591 378 Z"/>
    <path id="left-lower-circuit" d="M 488 474 L 471 465 L 469 465 L 463 461 L 461 461 L 459 459 L 453 457 L 452 456 L 452 445 L 450 443 L 448 443 L 446 441 L 443 440 L 443 463 L 457 470 L 459 470 L 465 474 L 467 474 L 469 476 L 471 476 L 477 479 L 479 481 L 479 541 L 477 546 L 467 557 L 458 563 L 431 577 L 429 577 L 417 583 L 387 593 L 384 593 L 383 594 L 380 594 L 363 599 L 358 599 L 352 601 L 336 603 L 336 604 L 393 604 L 402 600 L 407 599 L 410 597 L 412 597 L 415 595 L 417 595 L 429 589 L 431 589 L 453 578 L 469 568 L 478 561 L 485 553 L 488 546 Z"/>

    <g id="center-root" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="center-root-left"
        d="M510 543 C509 563 496 584 473 604"
        stroke="#eef5ff" stroke-width="5.2"/>
      <path id="center-root-right"
        d="M510 543 C513 566 534 596 568 621"
        stroke="#dce7ff" stroke-width="4.4"/>
    </g>

    <circle id="node-left-outer" cx="441" cy="407" r="15.1"/>
    <circle id="node-center-outer" cx="543" cy="428" r="13.8"/>
    <circle id="node-right-outer" cx="588" cy="391" r="15.1"/>
    <circle id="circuit-dot" cx="564" cy="365" r="6.5"/>

    <g id="node-holes" stroke="#2752f4" stroke-width="1.05">
      <circle id="node-left-hole" cx="441" cy="407" r="6.1" fill="url(#nodeLeftFill)"/>
      <circle id="node-center-hole" cx="543" cy="428" r="4.9" fill="url(#nodeCenterFill)"/>
      <circle id="node-right-hole" cx="588" cy="391" r="6.0" fill="url(#nodeRightFill)"/>
    </g>
  </g>
</svg>
